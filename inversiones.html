<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manolo — Inversiones</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">Manolo</span>
    <button class="menu-toggle" id="menu-toggle" data-icon="menu" aria-expanded="false" aria-label="Abrir menú"></button>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <span class="brand">Manolo</span>
      <nav id="nav-links"></nav>
    </aside>

    <div class="main">
      <div class="verse-banner" id="verse-banner">
        <span class="verse-text"></span>
        <span class="verse-ref"></span>
      </div>

      <div class="content">
        <h1 class="page-title">Inversiones</h1>

        <div class="stat-row" id="investing-stats"></div>

        <form class="tracker-form" id="investing-form">
          <input type="date" id="investing-date" required>
          <input type="text" id="investing-name" placeholder="Activo (ej: AAPL, Fondo indexado)" required>
          <input type="number" id="investing-amount" placeholder="Monto invertido" min="0.01" step="0.01" required>
          <input type="text" id="investing-notes" placeholder="Notas (opcional)">
          <button type="submit">Registrar</button>
        </form>

        <div id="investing-list"></div>
        <p class="empty-state" id="investing-empty" style="display:none;">Aún no registras aportes.</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav-links"></nav>

  <script src="js/verses.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/main.js"></script>
  <script src="js/inversiones.js"></script>
</body>
</html>
