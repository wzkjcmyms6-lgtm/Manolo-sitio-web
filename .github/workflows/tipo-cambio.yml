name: Tipo de cambio BCB

on:
  schedule:
    # 8:00, 13:00 y 18:00 en La Paz (UTC-4)
    - cron: "0 12,17,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tipo-cambio
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer TCO del BCB
        run: python scripts/tipo_cambio.py
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- data/tipo-cambio.json; then
            echo "Sin cambios"
          else
            git config user.name "tipo-cambio-bot"
            git config user.email "tipo-cambio-bot@users.noreply.github.com"
            git add data/tipo-cambio.json
            git commit -m "Tipo de cambio BCB $(date -u +%F)"
            git pull --rebase
            git push
          fi
