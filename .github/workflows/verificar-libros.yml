name: Verificar búsqueda de libros (temporal)

# Prueba de una sola vez: ¿qué datos da Open Library al buscar un libro por
# título (autor, páginas, año, temas, idioma) y por ISBN? Se borra después
# de verificar (docs/LIBROS_BIBLIA.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Open Library
        run: |
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request
          ORIGEN = "https://wzkjcmyms6-lgtm.github.io"
          UA = "Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1"
          CAMPOS = "key,title,author_name,cover_i,first_publish_year,number_of_pages_median,subject,language,edition_count,isbn"
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Origin": ORIGEN, "Accept": "application/json"})
              t = time.time()
              try:
                  r = urllib.request.urlopen(req, timeout=25)
                  return r.status, dict(r.headers), r.read(), round(time.time() - t, 2)
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read(), round(time.time() - t, 2)
          def mostrar(etiqueta, params):
              q = urllib.parse.urlencode(params)
              s, h, c, t = get(f"https://openlibrary.org/search.json?{q}")
              docs = json.loads(c).get("docs", []) if s == 200 else []
              print(f"\n## {etiqueta}: HTTP {s}, {t}s, {len(c)} bytes, CORS={h.get('Access-Control-Allow-Origin') or h.get('access-control-allow-origin')}, {len(docs)} resultados")
              for d in docs[:5]:
                  temas = d.get("subject") or []
                  print(f"  - {d.get('title')} | {d.get('author_name')} | año {d.get('first_publish_year')} | págs {d.get('number_of_pages_median')} | portada {d.get('cover_i')} | ediciones {d.get('edition_count')} | idiomas {(d.get('language') or [])[:6]} | key {d.get('key')}")
                  print(f"      temas ({len(temas)}): {temas[:12]}")
          mostrar("q título parcial", {"q": "el amor en los tiempos", "fields": CAMPOS, "limit": 8})
          mostrar("q título completo", {"q": "El amor en los tiempos del cólera", "fields": CAMPOS, "limit": 8})
          mostrar("q sin tildes", {"q": "cien anos de soledad", "fields": CAMPOS, "limit": 8})
          mostrar("q título + autor", {"q": "habitos atomicos james clear", "fields": CAMPOS, "limit": 8})
          mostrar("q padre rico", {"q": "padre rico padre pobre", "fields": CAMPOS, "limit": 8})
          mostrar("q biblia/cristiano", {"q": "una vida con proposito", "fields": CAMPOS, "limit": 8})
          mostrar("q con lang=es", {"q": "el principito", "fields": CAMPOS, "limit": 8, "lang": "es"})
          mostrar("isbn", {"q": "isbn:9780307387264", "fields": CAMPOS, "limit": 3})
          mostrar("isbn suelto", {"q": "9788497592208", "fields": CAMPOS, "limit": 3})
          mostrar("title= y author=", {"title": "El amor en los tiempos del cólera", "author": "García Márquez", "fields": CAMPOS, "limit": 5})
          PY
