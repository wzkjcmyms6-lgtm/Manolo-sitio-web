<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manolo — Panel personal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">Manolo</span>
    <button class="menu-toggle" id="menu-toggle" data-icon="menu" aria-expanded="false" aria-label="Abrir menú"></button>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <span class="brand">Manolo</span>
      <nav id="nav-links"></nav>
    </aside>

    <div class="main">
      <div class="verse-banner" id="verse-banner">
        <span class="verse-text"></span>
        <span class="verse-ref"></span>
      </div>

      <div class="content">
        <h1 class="page-title">Bienvenido, Manolo</h1>
        <p>Tu panel de control personal. Elige una sección para empezar.</p>

        <div class="card-grid">
          <a class="card" href="habitos.html">
            <span class="icon" data-icon="habits"></span>
            <h3>Hábitos</h3>
            <p>Registra y sigue tus hábitos diarios.</p>
          </a>
          <a class="card" href="ejercicio.html">
            <span class="icon" data-icon="exercise"></span>
            <h3>Ejercicio</h3>
            <p>Lleva el control de tus entrenamientos.</p>
          </a>
          <a class="card" href="finanzas.html">
            <span class="icon" data-icon="finance"></span>
            <h3>Finanzas</h3>
            <p>Controla tus ingresos y gastos.</p>
          </a>
          <a class="card" href="inversiones.html">
            <span class="icon" data-icon="investing"></span>
            <h3>Inversiones</h3>
            <p>Registra tus aportes y sigue tu portafolio.</p>
          </a>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav-links"></nav>

  <script src="js/verses.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
