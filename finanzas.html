<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manolo — Finanzas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <span class="brand">Manolo</span>
    <button class="menu-toggle" id="menu-toggle" data-icon="menu" aria-expanded="false" aria-label="Abrir menú"></button>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <span class="brand">Manolo</span>
      <nav id="nav-links"></nav>
    </aside>

    <div class="main">
      <div class="verse-banner" id="verse-banner">
        <span class="verse-text"></span>
        <span class="verse-ref"></span>
      </div>

      <div class="content">
        <h1 class="page-title">Finanzas</h1>

        <div class="fin-tabs" id="fin-tabs">
          <button type="button" class="fin-tab active" data-tab="resumen">Resumen</button>
          <button type="button" class="fin-tab" data-tab="presupuesto">Presupuesto</button>
        </div>

        <!-- ===== Resumen ===== -->
        <section id="tab-resumen" class="fin-panel">
          <div class="stat-row" id="finance-stats"></div>

          <div class="month-nav">
            <button type="button" id="month-prev" aria-label="Mes anterior"><span data-icon="chevronLeft"></span></button>
            <div class="month-label">
              <span id="month-label-text"></span>
              <span class="month-count" id="month-count"></span>
            </div>
            <button type="button" id="month-next" aria-label="Mes siguiente"><span data-icon="chevronRight"></span></button>
          </div>

          <form class="tracker-form" id="finance-form">
            <input type="date" id="finance-date" required>
            <select id="finance-type">
              <option value="ingreso">Ingreso</option>
              <option value="gasto">Gasto</option>
            </select>
            <select id="finance-category"></select>
            <select id="finance-payment"></select>
            <input type="text" id="finance-desc" placeholder="Descripción" required>
            <input type="number" id="finance-amount" placeholder="Monto" min="0.01" step="0.01" required>
            <button type="submit">Registrar</button>
          </form>

          <div id="finance-list"></div>
          <p class="empty-state" id="finance-empty" style="display:none;">Aún no registras movimientos este mes.</p>
        </section>

        <!-- ===== Presupuesto ===== -->
        <section id="tab-presupuesto" class="fin-panel" hidden>
          <div class="budget-header">
            <h2 id="budget-month-label"></h2>
            <button type="button" class="link-btn" id="budget-edit-toggle">Editar presupuestos</button>
          </div>

          <form id="budget-form" class="budget-form" hidden>
            <div id="budget-inputs"></div>
            <button type="submit">Guardar presupuestos</button>
          </form>

          <div id="budget-grid" class="budget-grid"></div>
        </section>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav-links"></nav>

  <script src="js/verses.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/main.js"></script>
  <script src="js/finanzas.js"></script>
</body>
</html>
