<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manolo — Hábitos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="login-screen" class="login-screen">
    <div class="login-card">
      <span class="brand">Manolo</span>
      <p class="login-sub">Ingresá para continuar</p>
      <form id="login-form">
        <input type="text" id="login-username" placeholder="Usuario" autocomplete="username" required>
        <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
      </form>
      <p class="login-error" id="login-error" hidden></p>
    </div>
  </div>

  <div id="app-content" hidden>
  <div class="topbar">
    <span class="brand">Manolo</span>
    <button class="menu-toggle" id="menu-toggle" data-icon="menu" aria-expanded="false" aria-label="Abrir menú"></button>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <span class="brand">Manolo</span>
      <nav id="nav-links"></nav>
    </aside>

    <div class="main">
      <div class="verse-banner" id="verse-banner">
        <span class="verse-text"></span>
        <span class="verse-ref"></span>
      </div>

      <div class="content">
        <h1 class="page-title">Hábitos</h1>

        <form class="tracker-form" id="habit-form">
          <input type="text" id="habit-name" placeholder="Nuevo hábito (ej: Leer 10 min)" required>
          <button type="submit">Agregar</button>
        </form>

        <div class="habit-days-header" id="habit-days-header"></div>
        <div id="habit-list"></div>
        <p class="empty-state" id="habit-empty" style="display:none;">Aún no tienes hábitos. Agrega el primero arriba.</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" id="bottom-nav-links"></nav>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/verses.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/modules.js"></script>
  <script src="js/main.js"></script>
  <script src="js/habitos.js"></script>
</body>
</html>
